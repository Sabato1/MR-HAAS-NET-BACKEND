<!DOCTYPE html>
<html lang="sw" x-data="app()" :dir="lang === 'ar'? 'rtl' : 'ltr'">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MR HAAS NET | WISP Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-slate-900 text-slate-100">
<div class="flex min-h-screen">

<!-- DESKTOP SIDEBAR -->
<aside class="w-64 shrink-0 bg-slate-950 p-5 hidden md:flex md:flex-col">
    <h1 class="text-xl font-bold text-blue-400 mb-8"><i class="fa-solid fa-wifi"></i> MR HAAS NET</h1>
    <nav class="space-y-2 flex-1">
        <template x-for="item in navigation" :key="item.id">
            <button type="button" @click="currentTab=item.id" :class="currentTab===item.id?'bg-blue-600 text-white':'text-slate-400 hover:bg-slate-800'" class="w-full rounded-xl p-3 text-left"><i :class="item.icon" class="mr-2 w-5"></i><span x-text="item.label"></span></button>
        </template>
    </nav>
    <div class="mt-10 rounded-xl bg-emerald-950/50 border border-emerald-900 p-3 text-sm text-emerald-400"><i class="fa-solid fa-circle-check"></i> System Online</div>
</aside>

<!-- MOBILE DRAWER -->
<div x-show="mobileMenu" x-cloak class="fixed inset-0 z-[60] md:hidden" x-transition.opacity>
    <div @click="mobileMenu=false" class="absolute inset-0 bg-black/70"></div>
    <div class="relative w-[85%] max-w-[300px] h-full bg-slate-950 p-5 flex flex-col" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full">
        <div class="flex items-center justify-between mb-8"><h1 class="text-xl font-bold text-blue-400"><i class="fa-solid fa-wifi"></i> MR HAAS NET</h1><button @click="mobileMenu=false" class="w-8 h-8 rounded-full bg-slate-800"><i class="fa-solid fa-xmark"></i></button></div>
        <nav class="space-y-2 flex-1"><template x-for="item in navigation" :key="item.id"><button type="button" @click="currentTab=item.id; mobileMenu=false" :class="currentTab===item.id?'bg-blue-600 text-white':'text-slate-400'" class="w-full rounded-xl p-3.5 text-left"><i :class="item.icon" class="mr-3 w-5"></i><span x-text="item.label"></span></button></template></nav>
    </div>
</div>

<main class="min-w-0 flex-1">
    <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur border-b border-slate-800 p-4 md:p-8">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <button type="button" @click="mobileMenu=true" class="md:hidden w-10 h-10 rounded-xl bg-slate-800 border border-slate-700"><i class="fa-solid fa-bars"></i></button>
                <div><h2 class="text-lg md:text-2xl font-bold" x-text="pageTitle"></h2></div>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" @click="lang=lang==='sw'?'en':'sw'" class="rounded-xl border border-slate-700 bg-slate-800 px-3 py-2.5 text-sm"><i class="fa-solid fa-language"></i> <span x-text="lang.toUpperCase()"></span></button>
                <button type="button" @click="openClient()" class="rounded-xl bg-blue-600 px-4 py-2.5 font-semibold text-sm">Ongeza Mteja</button>
            </div>
        </div>
    </header>

    <div class="p-4 md:p-8">
    <section x-show="currentTab==='dashboard'" x-cloak>
        <div class="grid grid-cols-2 gap-3 xl:grid-cols-4"><template x-for="stat in stats" :key="stat.label"><div class="rounded-2xl border border-slate-800 bg-slate-950 p-5"><i :class="stat.icon" class="mb-3 text-2xl text-blue-400"></i><p class="text-sm text-slate-400" x-text="stat.label"></p><h3 class="mt-2 text-2xl font-bold" x-text="stat.value"></h3></div></template></div>
        <div class="mt-6 rounded-2xl border border-slate-800 bg-slate-950 p-5"><h3 class="mb-4 font-bold">Quick Actions</h3><div class="grid grid-cols-1 gap-3 sm:grid-cols-3"><button type="button" @click="openClient()" class="rounded-xl bg-blue-600 p-4 hover:bg-blue-500"><i class="fa-solid fa-user-plus mr-2"></i> Ongeza Mteja</button><button type="button" @click="openDevice()" class="rounded-xl bg-slate-800 p-4 hover:bg-slate-700"><i class="fa-solid fa-network-wired mr-2"></i> Ongeza Kifaa</button><button type="button" @click="currentTab='payments'" class="rounded-xl bg-slate-800 p-4 hover:bg-slate-700"><i class="fa-solid fa-wallet mr-2"></i> Malipo</button></div></div>
    </section>

    <section x-show="currentTab==='clients'" x-cloak>
        <div class="mb-4 flex justify-between"><h3 class="text-xl font-bold">Orodha ya Wateja</h3><button type="button" @click="openClient()" class="rounded-xl bg-blue-600 px-4 py-2.5 text-sm"><i class="fa-solid fa-plus"></i> Ongeza</button></div>
        <div class="overflow-x-auto rounded-xl border border-slate-800 bg-slate-950"><table class="w-full text-left text-sm"><thead class="bg-slate-900 text-slate-400"><tr><th class="p-3">Jina</th><th class="p-3">Simu</th><th class="p-3">Username</th><th class="p-3">Kifurushi</th></tr></thead><tbody><template x-for="c in clients" :key="c.id"><tr class="border-t border-slate-800"><td class="p-3" x-text="c.name"></td><td class="p-3" x-text="c.phone"></td><td class="p-3" x-text="c.username"></td><td class="p-3" x-text="c.package_name"></td></tr></template><tr x-show="clients.length===0"><td colspan="4" class="p-8 text-center text-slate-400">Hakuna wateja bado.</td></tr></tbody></table></div>
    </section>

    <section x-show="currentTab==='devices'" x-cloak>
        <div class="mb-4 flex justify-between items-center"><h3 class="text-xl font-bold">Vifaa vya Mtandao</h3><button type="button" @click="openDevice()" class="rounded-xl bg-blue-600 px-4 py-2.5 text-sm"><i class="fa-solid fa-plus"></i> Ongeza Kifaa</button></div>
        
        <!-- ORODHA YA VIFAA PAMOJA NA HALI (ONLINE/OFFLINE) NA KITUFE CHA KUFUTA -->
        <div class="space-y-3">
            <template x-for="d in devices" :key="d.id">
                <div class="rounded-xl border border-slate-800 bg-slate-950 p-4 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-3 h-3 rounded-full" :class="d.status === 'Online' ? 'bg-emerald-500 animate-pulse' : 'bg-red-500'"></div>
                        <div>
                            <h4 class="font-bold text-sm text-white" x-text="d.name"></h4>
                            <p class="text-xs text-slate-400" x-text="d.host || d.mac_address || 'Connected'"></p>
                            <span class="text-[10px] uppercase font-semibold text-blue-400" x-text="d.type"></span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="px-2.5 py-1 text-xs rounded-full font-medium" :class="d.status === 'Online' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'" x-text="d.status || 'Offline'"></span>
                        <button type="button" @click="deleteDevice(d.id)" class="text-slate-500 hover:text-red-400 p-2"><i class="fa-solid fa-trash text-sm"></i></button>
                    </div>
                </div>
            </template>
            <div x-show="devices.length===0" class="rounded-xl bg-slate-950 p-8 text-center text-slate-400">Hakuna vifaa vilivyosajiliwa bado.</div>
        </div>
    </section>

    <section x-show="currentTab==='payments'" x-cloak><div class="rounded-2xl border border-slate-800 bg-slate-950 p-6"><i class="fa-solid fa-wallet mb-3 text-3xl text-blue-400"></i><h3 class="text-xl font-bold">Malipo</h3><p class="mt-2 text-slate-400">Mobile Money integration inahitaji backend.</p></div></section>
    </div>
</main>
</div>

<!-- MODAL CLIENT -->
<div x-show="addClientModal" x-cloak x-transition.opacity class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 p-4" @keydown.escape.window="addClientModal=false">
    <div x-show="addClientModal" x-transition.scale class="w-full max-w-lg rounded-[20px] border border-slate-700 bg-slate-950 p-6">
        <div class="mb-5 flex justify-between"><h3 class="text-xl font-bold">Sajili Mteja Mpya</h3><button type="button" @click="addClientModal=false" class="w-8 h-8 rounded-full bg-slate-800"><i class="fa-solid fa-xmark"></i></button></div>
        <form @submit.prevent="submitClient()" class="space-y-4">
            <input x-model="newClient.name" required placeholder="Jina kamili" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3.5">
            <input x-model="newClient.phone" required type="tel" placeholder="Namba ya simu" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3.5">
            <input x-model="newClient.username" required placeholder="Username" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3.5">
            <select x-model="newClient.package_name" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3.5"><option>Standard 5Mbps</option><option>Standard 10Mbps</option><option>Premium 20Mbps</option></select>
            <p x-show="formError" x-text="formError" class="text-sm text-red-400"></p>
            <div class="flex gap-3"><button type="button" @click="addClientModal=false" class="flex-1 rounded-xl bg-slate-800 p-3">Ghairi</button><button type="submit" :disabled="saving" class="flex-1 rounded-xl bg-blue-600 p-3 font-bold" x-text="saving?'Inahifadhi...':'Hifadhi Mteja'"></button></div>
        </form>
    </div>
</div>

<!-- MODAL DEVICE (MULTIBRAND: MIKROTIK, OMADA, GRANDSTREAM, RUIJIE, CUDY, RADIUS) -->
<div x-show="addDeviceModal" x-cloak x-transition.opacity class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 p-4" @keydown.escape.window="addDeviceModal=false">
    <div x-show="addDeviceModal" x-transition.scale class="w-full max-w-lg rounded-[20px] border border-slate-700 bg-slate-950 p-6 max-h-[90vh] overflow-y-auto">
        <div class="mb-5 flex justify-between items-center border-b border-slate-800 pb-3">
            <h3 class="text-xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-network-wired text-blue-500"></i> Sajili Kifaa / AP Mpya</h3>
            <button type="button" @click="addDeviceModal=false" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="space-y-4 text-xs">
            <div>
                <label class="block mb-1 text-slate-400 font-medium">1. Chagua Chapa ya Kifaa (Device Brand)</label>
                <select x-model="deviceBrand" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3 text-sm text-white focus:outline-none focus:border-blue-500">
                    <option value="mikrotik">MikroTik RouterOS</option>
                    <option value="omada">TP-Link Omada EAP (AP Adoption)</option>
                    <option value="grandstream">Grandstream GWN AP (Adopt by MAC)</option>
                    <option value="ruijie">Ruijie / Reyee Networks</option>
                    <option value="cudy">Cudy Networking</option>
                    <option value="radius">FreeRADIUS / External Server</option>
                </select>
            </div>

            <!-- MIKROTIK CONFIG & SCRIPT GENERATOR -->
            <template x-if="deviceBrand === 'mikrotik'">
                <div class="space-y-3 p-4 bg-slate-900/60 rounded-xl border border-slate-800">
                    <div>
                        <label class="block mb-1 text-slate-300 font-medium">Chagua Modeli ya MikroTik</label>
                        <select x-model="mikrotikModel" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3 text-white">
                            <option value="hex">MikroTik hEX / hEX S (RB750Gr3)</option>
                            <option value="hap">MikroTik hAP ac² / ac³ / hAP ax</option>
                            <option value="ccr">MikroTik Cloud Core Router (CCR)</option>
                            <option value="netmetal">MikroTik NetMetal / LHG / SXT</option>
                            <option value="generic">MikroTik Nyingine Yoyote (RouterOS v6 & v7)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-300 font-medium">Chagua Internet / WAN Port Kuu</label>
                        <select x-model="mikrotikWanPort" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3 text-white">
                            <option value="ether1">ether1 (Standard WAN)</option>
                            <option value="ether2">ether2</option>
                            <option value="ether3">ether3</option>
                            <option value="ether4">ether4</option>
                        </select>
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-300 font-medium">Jina la Router (Identity)</label>
                        <input type="text" x-model="configRouterName" placeholder="Mfano: Singida-Main-Router" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3 text-white">
                    </div>
                    <div class="mt-2 pt-2 border-t border-slate-800">
                        <p class="text-[11px] text-slate-400 mb-1">Copy amri hii na ui-paste kwenye **New Terminal** ya WinBox:</p>
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 font-mono text-[11px] text-emerald-400 overflow-x-auto">
                            <div class="flex justify-between items-center mb-1 pb-1 border-b border-slate-800 text-slate-400">
                                <span>Terminal Command</span>
                                <button type="button" @click="copyScript()" class="bg-blue-600 text-white text-[10px] px-2.5 py-1 rounded-lg">Copy</button>
                            </div>
                            <pre x-text="generatedScript" class="whitespace-pre-wrap break-all"></pre>
                        </div>
                    </div>
                </div>
            </template>

            <!-- OMADA & GRANDSTREAM AP ADOPTION OPTIONS -->
            <template x-if="deviceBrand === 'omada' || deviceBrand === 'grandstream'">
                <div class="space-y-3 p-4 bg-slate-900/60 rounded-xl border border-slate-800">
                    <p class="text-[11px] text-blue-400 font-medium">Weka taarifa za AP kama zinavyoonekana kwenye Controller:</p>
                    <div>
                        <label class="block mb-1 text-slate-300 font-medium">Jina la AP (Name)</label>
                        <input type="text" x-model="apDevice.name" placeholder="Mfano: Office AP / Lobby AP" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3 text-white">
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-300 font-medium">MAC Address / Device Key</label>
                        <input type="text" x-model="apDevice.mac_address" placeholder="Mfano: AA:BB:CC:DD:EE:FF" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3 text-white">
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-300 font-medium">Device Username (Optional)</label>
                        <input type="text" x-model="apDevice.username" placeholder="admin" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3 text-white">
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-300 font-medium">Device Password (Standalone password)</label>
                        <input type="password" x-model="apDevice.password" placeholder="Weka password kama imebadilishwa" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3 text-white">
                    </div>
                </div>
            </template>

            <!-- RUIJIE, CUDY & RADIUS -->
            <template x-if="deviceBrand !== 'mikrotik' && deviceBrand !== 'omada' && deviceBrand !== 'grandstream'">
                <div class="space-y-3 p-4 bg-slate-900/60 rounded-xl border border-slate-800">
                    <div>
                        <label class="block mb-1 text-slate-300 font-medium">Jina la Kifaa / Seva</label>
                        <input type="text" x-model="apDevice.name" placeholder="Mfano: Ruijie Core Switch" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3 text-white">
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-300 font-medium">IP Address / Host</label>
                        <input type="text" x-model="apDevice.host" placeholder="192.168.1.250" class="w-full rounded-xl border border-slate-700 bg-slate-900 p-3 text-white">
                    </div>
                </div>
            </template>

            <div class="flex gap-3 pt-2">
                <button type="button" @click="addDeviceModal=false" class="flex-1 rounded-xl bg-slate-800 p-3 text-slate-300">Ghairi</button>
                <button type="button" @click="saveDeviceEntry()" :disabled="saving" class="flex-1 rounded-xl bg-blue-600 p-3 font-bold text-white" x-text="saving?'Inasajili...':'Kamilisha Usajili'"></button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('app', () => ({
        lang: 'sw', currentTab: 'dashboard', mobileMenu: false,
        addClientModal: false, addDeviceModal: false, saving: false, formError: '',
        tenantId: 'tenant_01',
        deviceBrand: 'mikrotik',
        mikrotikModel: 'hex',
        mikrotikWanPort: 'ether1',
        configRouterName: 'MR-HAAS-ROUTER',
        apDevice: { name: '', mac_address: '', username: '', password: '', host: '' },
        clients: JSON.parse(localStorage.getItem('mrhaas_clients')||'[]'),
        devices: JSON.parse(localStorage.getItem('mrhaas_devices')||'[]'),
        newClient: { tenant_id: 'tenant_01', name: '', phone: '', username: '', package_name: 'Standard 10Mbps' },
        
        get navigation(){ return [{id:'dashboard', label:'Dashboard', icon:'fa-solid fa-chart-pie'},{id:'devices', label:'Orodha ya Vifaa', icon:'fa-solid fa-network-wired'},{id:'clients', label:'Orodha ya Wateja', icon:'fa-solid fa-users'},{id:'payments', label:'Malipo', icon:'fa-solid fa-wallet'}]; },
        get pageTitle(){ const t={dashboard:'Muhtasari', devices:'Vifaa vya Mtandao', clients:'Wateja', payments:'Malipo'}; return t[this.currentTab]; },
        get stats(){ return [{label:'Wateja Wote', value:this.clients.length, icon:'fa-solid fa-users'},{label:'Vifaa', value:this.devices.length, icon:'fa-solid fa-network-wired'},{label:'Mapato ya Leo', value:'TSh 0', icon:'fa-solid fa-money-bill-wave'},{label:'WISP', value:'1', icon:'fa-solid fa-wifi'}]; },
        
        get generatedScript(){
            const host = window.location.origin;
            return `# MR HAAS NET - Auto Setup (${this.mikrotikModel.toUpperCase()})\n:local tId "${this.tenantId}";\n:local rName "${this.configRouterName}";\n:local wanPort "${this.mikrotikWanPort}";\n:local url "${host}/api/mikrotik/register-router";\n/interface list member add interface=$wanPort list=WAN;\n/tool fetch url=$url http-method=post http-header-field="Content-Type: application/json" http-data="{\\"tenant_id\\":\\"$tId\\",\\"name\\":\\"$rName\\",\\"model\\":\\"${this.mikrotikModel}\\",\\"wan_port\\":\\"$wanPort\\"}" keep-result=no;\n:log info "MR HAAS NET: Router Connected Successfully!";`;
        },
        copyScript(){
            navigator.clipboard.writeText(this.generatedScript);
            alert('Amri imekopiwa! Nenda ka-paste kwenye WinBox Terminal.');
        },

        openClient(){ this.formError=''; this.addClientModal=true; },
        openDevice(){ this.formError=''; this.addDeviceModal=true; },

        async saveDeviceEntry(){
            this.saving = true;
            try {
                if(this.deviceBrand === 'mikrotik') {
                    const entry = { id: Date.now(), tenant_id: this.tenantId, name: this.configRouterName, type: `mikrotik-${this.mikrotikModel}`, host: `WAN: ${this.mikrotikWanPort}`, status: 'Online' };
                    this.devices.push(entry);
                } else {
                    const entry = { id: Date.now(), tenant_id: this.tenantId, type: this.deviceBrand, status: 'Online', ...this.apDevice };
                    this.devices.push(entry);
                }
                localStorage.setItem('mrhaas_devices', JSON.stringify(this.devices));
                alert('Kifaa kimesajiliwa kwa mafanikio!');
                this.addDeviceModal = false;
                this.apDevice = { name: '', mac_address: '', username: '', password: '', host: '' };
            } catch(e) {
                alert('Hitilafu imetokea.');
            } finally {
                this.saving = false;
            }
        },

        deleteDevice(id){
            if(confirm('Una uhakika unataka kuondoa kifaa hiki kwenye mfumo?')) {
                this.devices = this.devices.filter(d => d.id !== id);
                localStorage.setItem('mrhaas_devices', JSON.stringify(this.devices));
            }
        },

        async submitClient(){
            this.formError=''; this.saving=true;
            try{
                const entry={id:Date.now(),...this.newClient}; this.clients.push(entry); localStorage.setItem('mrhaas_clients', JSON.stringify(this.clients));
                this.addClientModal=false; this.newClient.name=''; this.newClient.phone=''; this.newClient.username='';
            }catch(err){ this.formError=err.message; } finally{ this.saving=false; }
        },

        async fetchClients(){ try{ const r=__await ? await fetch('/api/clients/'+this.tenantId) : fetch('/api/clients/'+this.tenantId); if(!r.ok) return; const d=await r.json(); if(d.success && d.clients?.length){ this.clients=d.clients; localStorage.setItem('mrhaas_clients', JSON.stringify(this.clients)); } }catch(e){} },
        async fetchDevices(){ try{ const r=await fetch('/api/devices/'+this.tenantId); if(!r.ok) return; const d=await r.json(); if(d.success && d.devices?.length){ this.devices=d.devices; localStorage.setItem('mrhaas_devices', JSON.stringify(this.devices)); } }catch(e){} },
        init(){ this.fetchClients(); this.fetchDevices(); }
    }));
});
</script>
</body>
</html>
