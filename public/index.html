<!DOCTYPE html>
<html lang="sw" x-data="app" :dir="lang === 'ar' ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR HAAS MULTI-TENANT WISP MANAGEMENT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js kwa ajili ya Interactivity na Lugha -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome kwa ajili ya Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js kwa ajili ya Chati -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('app', () => ({
                lang: 'sw',
                sidebarOpen: false,
                currentTab: 'dashboard',
                addDeviceModal: false,
                addClientModal: false,
                tenantId: 'tenant_01',
                devices: [],
                clients: [],
                newDevice: {
                    tenant_id: 'tenant_01',
                    name: '',
                    host: '',
                    user: 'admin',
                    password: '',
                    port: 8728,
                    type: 'mikrotik'
                },
                newClient: {
                    tenant_id: 'tenant_01',
                    name: '',
                    phone: '',
                    username: '',
                    package_name: 'Standard 10Mbps'
                },
                init() {
                    this.fetchDevices();
                    this.fetchClients();
                },
                async fetchDevices() {
                    try {
                        const res = await fetch(`/api/devices/${this.tenantId}`);
                        const data = await res.json();
                        if (data.success) {
                            this.devices = data.devices;
                        }
                    } catch (e) {
                        console.error('Error fetching devices:', e);
                    }
                },
                async fetchClients() {
                    try {
                        const res = await fetch(`/api/clients/${this.tenantId}`);
                        const data = await res.json();
                        if (data.success) {
                            this.clients = data.clients;
                        }
                    } catch (e) {
                        console.error('Error fetching clients:', e);
                    }
                },
                async submitDevice() {
                    try {
                        const res = await fetch('/api/devices', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.newDevice)
                        });
                        const data = await res.json();
                        if (data.success) {
                            alert('Kifaa kimesajiliwa kwa mafanikio!');
                            this.addDeviceModal = false;
                            this.newDevice.name = '';
                            this.newDevice.host = '';
                            this.fetchDevices();
                        } else {
                            alert('Hitilafu: ' + data.error);
                        }
                    } catch (e) {
                        alert('Kuna tatizo la mtandao.');
                    }
                },
                async submitClient() {
                    try {
                        const res = await fetch('/api/clients', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.newClient)
                        });
                        const data = await res.json();
                        if (data.success) {
                            alert('Mteja amesajiliwa kwa mafanikio!');
                            this.addClientModal = false;
                            this.newClient.name = '';
                            this.newClient.phone = '';
                            this.newClient.username = '';
                            this.fetchClients();
                        } else {
                            alert('Hitilafu: ' + data.error);
                        }
                    } catch (e) {
                        alert('Kuna tatizo la mtandao.');
                    }
                },
                t(key) {
                    const dict = {
                        sw: {
                            dashboard: "Dashboard",
                            wisp_management: "Usimamizi wa WISP",
                            active_wisps: "WISP Zilizopo",
                            total_clients: "Wateja Wote",
                            today_revenue: "Mapato ya Leo",
                            network_devices: "Vifaa vya Mtandao",
                            search_placeholder: "Tafuta hapa...",
                            welcome: "MR HAAS MULTI-TENANT WISP MANAGEMENT",
                            subtitle: "Hapa ni muhtasari na usimamizi wa mfumo wako wa cloud WISP",
                            recent_activities: "Shughuli za Hivi Karibuni",
                            system_status: "Hali ya Mfumo",
                            online: "Online",
                            view_all: "Tazama zote",
                            revenue_chart: "Mapato ya WISP (Siku 7 Zilizopita)",
                            quick_add_wisp: "Ongeza Kifaa / WISP",
                            quick_add_client: "Ongeza Mteja",
                            quick_create_pkg: "Tengeneza Kifurushi",
                            quick_payment: "Malipo ya Simu",
                            quick_reports: "Tazama Ripoti"
                        },
                        en: {
                            dashboard: "Dashboard",
                            wisp_management: "WISP Management",
                            active_wisps: "Active WISPs",
                            total_clients: "Total Clients",
                            today_revenue: "Today's Revenue",
                            network_devices: "Network Devices",
                            search_placeholder: "Search here...",
                            welcome: "MR HAAS MULTI-TENANT WISP MANAGEMENT",
                            subtitle: "Summary and cloud management dashboard for your WISP operations",
                            recent_activities: "Recent Activities",
                            system_status: "System Status",
                            online: "Online",
                            view_all: "View all",
                            revenue_chart: "WISP Revenue (Last 7 Days)",
                            quick_add_wisp: "Add Device / WISP",
                            quick_add_client: "Add Client",
                            quick_create_pkg: "Create Package",
                            quick_payment: "Mobile Payment",
                            quick_reports: "View Reports"
                        }
                    };
                    return dict[this.lang][key] || key;
                }
            }))
        });
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR OVERLAY FOR MOBILE -->
        <div x-show="sidebarOpen" @click="sidebarOpen = false" class="fixed inset-0 bg-black/60 z-20 md:hidden"></div>

        <!-- SIDEBAR -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'" class="fixed md:static inset-y-0 left-0 z-30 w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between transition-transform duration-300 ease-in-out md:translate-x-0">
            <div>
                <!-- Logo -->
                <div class="flex items-center justify-between px-6 py-5 border-b border-slate-800">
                    <div class="flex items-center gap-3">
                        <div class="bg-blue-600 p-2 rounded-xl text-white">
                            <i class="fa-solid fa-wifi text-xl"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-base tracking-wide text-blue-400">MR HAAS NET</h1>
                            <p class="text-[10px] text-slate-400">WISP SaaS Billing</p>
                        </div>
                    </div>
                    <button @click="sidebarOpen = false" class="md:hidden text-slate-400 hover:text-white">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <!-- Navigation Links -->
                <nav class="p-4 space-y-1 text-sm">
                    <button @click="currentTab = 'dashboard'; sidebarOpen = false" :class="currentTab === 'dashboard' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:text-white hover:bg-slate-900'" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition">
                        <i class="fa-solid fa-chart-pie w-5"></i> <span x-text="t('dashboard')"></span>
                    </button>

                    <div class="pt-4 pb-2 px-4 text-xs font-semibold text-slate-400 uppercase tracking-wider" x-text="t('wisp_management')"></div>

                    <button @click="currentTab = 'devices'; sidebarOpen = false" :class="currentTab === 'devices' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:text-white hover:bg-slate-900'" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg transition">
                        <i class="fa-solid fa-network-wired w-5"></i> Orodha ya Vifaa
                    </button>

                    <button @click="currentTab = 'clients'; sidebarOpen = false" :class="currentTab === 'clients' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:text-white hover:bg-slate-900'" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg transition">
                        <i class="fa-solid fa-user-group w-5"></i> Orodha ya Wateja
                    </button>

                    <button @click="addDeviceModal = true; sidebarOpen = false" class="w-full flex items-center gap-3 px-4 py-2.5 text-slate-400 hover:text-white hover:bg-slate-900 rounded-lg transition">
                        <i class="fa-solid fa-plus w-5"></i> Ongeza Kifaa / WISP
                    </button>

                    <button @click="currentTab = 'payments'; sidebarOpen = false" :class="currentTab === 'payments' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-400 hover:text-white hover:bg-slate-900'" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg transition">
                        <i class="fa-solid fa-wallet w-5"></i> Malipo
                    </button>
                </nav>
            </div>

            <!-- System Online Badge -->
            <div class="p-4 border-t border-slate-800">
                <div class="bg-emerald-950/50 border border-emerald-800/50 p-3 rounded-xl flex items-center gap-3">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-xs font-medium text-emerald-400">System Online</span>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            
            <!-- TOP NAVBAR -->
            <header class="h-16 bg-slate-950 border-b border-slate-800 flex items-center justify-between px-4 md:px-6 sticky top-0 z-10">
                <div class="flex items-center gap-3 w-1/2">
                    <!-- HAMBURGER MENU BUTTON FOR MOBILE -->
                    <button @click="sidebarOpen = !sidebarOpen" class="md:hidden text-slate-300 hover:text-white p-2 rounded-lg bg-slate-900 border border-slate-800">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>

                    <div class="relative w-full max-w-md hidden sm:block">
                        <i class="fa-solid fa-search absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                        <input type="text" :placeholder="t('search_placeholder')" class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Language Switcher -->
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-1 flex items-center text-xs font-medium">
                        <button @click="lang = 'sw'" :class="lang === 'sw' ? 'bg-blue-600 text-white' : 'text-slate-400'" class="px-2.5 py-1 rounded-lg transition">SW</button>
                        <button @click="lang = 'en'" :class="lang === 'en' ? 'bg-blue-600 text-white' : 'text-slate-400'" class="px-2.5 py-1 rounded-lg transition">EN</button>
                    </div>

                    <!-- User Profile -->
                    <div class="flex items-center gap-3 border-l border-slate-800 pl-3">
                        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-xs">
                            HA
                        </div>
                        <div class="text-left hidden sm:block">
                            <h4 class="text-xs font-bold text-slate-200">Super Admin</h4>
                            <p class="text-[10px] text-slate-400">admin@mrhaas.net</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- DASHBOARD BODY -->
            <main class="p-4 md:p-6 space-y-6">
                
                <!-- HEADER TITLE -->
                <div class="bg-gradient-to-r from-blue-900/40 via-slate-90
