
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>Jisajili | MR HAAS NET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background:
        radial-gradient(circle at top right, rgba(212,175,55,.13), transparent 35%),
        #080b12;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .panel {
      background: rgba(17, 24, 39, .94);
      border: 1px solid rgba(212, 175, 55, .25);
      box-shadow: 0 20px 70px rgba(0,0,0,.35);
    }
    .field {
      width: 100%;
      background: #080d17;
      border: 1px solid #30394a;
      border-radius: 10px;
      padding: 12px 14px;
      color: white;
      outline: none;
    }
    .field:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 2px rgba(212,175,55,.12);
    }
    .gold {
      background: linear-gradient(135deg,#f7dc83,#c49a25);
      color: #111827;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-2xl">
    <div class="text-center mb-7">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl border border-yellow-500/40 bg-yellow-500/10 mb-3">
        <span class="text-3xl">📡</span>
      </div>
      <h1 class="text-3xl font-extrabold tracking-wide">
        <span class="text-yellow-400">MR HAAS</span> NET
      </h1>
      <p class="text-gray-400 mt-2">Multi-Tenant WISP Management System</p>
      <p class="text-gray-500 text-sm mt-1">Sajili biashara yako ya Wi-Fi</p>
    </div>

    <section class="panel rounded-2xl p-5 sm:p-8">
      <div class="mb-6">
        <h2 class="text-2xl font-bold">Fungua akaunti ya WISP</h2>
        <p class="text-sm text-gray-400 mt-2">
          Anza kusimamia wateja, Hotspot, PPPoE, vifaa na malipo yako sehemu moja.
        </p>
      </div>

      <div id="message" class="hidden rounded-lg p-3 mb-4 text-sm" role="alert"></div>

      <form id="registerForm" class="space-y-5">
        <div>
          <label for="businessName" class="block text-sm text-gray-300 mb-2">
            Jina la biashara / WISP
          </label>
          <input
            id="businessName"
            name="businessName"
            class="field"
            type="text"
            placeholder="Mfano: MR HAAS NET"
            minlength="2"
            maxlength="100"
            autocomplete="organization"
            required
          >
        </div>

        <div>
          <label for="email" class="block text-sm text-gray-300 mb-2">
            Barua pepe ya msimamizi
          </label>
          <input
            id="email"
            name="email"
            class="field"
            type="email"
            placeholder="jina@example.com"
            maxlength="254"
            autocomplete="email"
            required
          >
        </div>

        <div class="grid sm:grid-cols-2 gap-4">
          <div>
            <label for="password" class="block text-sm text-gray-300 mb-2">
              Nenosiri
            </label>
            <input
              id="password"
              name="password"
              class="field"
              type="password"
              placeholder="Angalau herufi 8"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              required
            >
          </div>

          <div>
            <label for="confirmPassword" class="block text-sm text-gray-300 mb-2">
              Rudia nenosiri
            </label>
            <input
              id="confirmPassword"
              name="confirmPassword"
              class="field"
              type="password"
              placeholder="Rudia nenosiri"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              required
            >
          </div>
          
        </div>
        div>
          <label for="businessName" class="block text-sm text-gray-300 mb-2">
            Jina la biashara / WISP

        <div>
          <label for="plan" class="block text-sm text-gray-300 mb-2">
            Chagua mpango wako
          </label>
          <select id="plan" name="plan" class="field" required>
            <option value="START">START — TSh 10,000/mwezi</option>
            <option value="DIAMOND">DIAMOND — TSh 15,000/mwezi</option>
            <option value="PREMIUM">PREMIUM — TSh 20,000/mwezi</option>
            <option value="REVENUE_SHARE">REVENUE SHARE — TSh 20,000 usajili + 3% ya mapato ya mwezi</option>
          </select>
          <p class="text-xs text-gray-500 mt-2">
            Mpango uliochagua utawekwa kwenye akaunti yako. Malipo yatahitaji kuthibitishwa na mfumo wa backend.
          </p>
        </div>

        <div class="rounded-xl border border-yellow-500/20 bg-yellow-500/5 p-4">
          <div class="flex items-start gap-3">
            <span class="text-xl">🎁</span>
            <div>
              <p class="font-semibold text-yellow-300">Jaribio la siku 4</p>
              <p class="text-sm text-gray-400 mt-1">
                Kila WISP mpya anastahili kipindi cha majaribio cha siku 4 baada ya usajili kufanikiwa. Baada ya hapo, akaunti itahitaji usajili halali ili kuendelea kutumia huduma zinazolipiwa.
              </p>
            </div>
          </div>
        </div>

        <label class="flex items-start gap-3 text-sm text-gray-400">
          <input id="terms" type="checkbox" class="mt-1 accent-yellow-500" required>
          <span>
            Nakubali kutumia mfumo kwa taarifa sahihi na kulinda taarifa za akaunti yangu.
          </span>
        </label>

        <button
          id="submitButton"
          type="submit"
          class="gold w-full rounded-xl py-3 font-bold hover:brightness-110 transition"
        >
          Fungua Akaunti
        </button>
      </form>

      <div class="text-center mt-6 text-sm text-gray-400">
        Tayari una akaunti?
        <a href="/login.html" class="text-yellow-400 hover:underline font-semibold">
          Ingia hapa
        </a>
      </div>
    </section>

    <p class="text-center text-xs text-gray-600 mt-5">
      © <span id="year"></span> MR HAAS NET. Haki zote zimehifadhiwa.
    </p>
  </main>

  <script>
    const form = document.getElementById('registerForm');
    const message = document.getElementById('message');
    const submitButton = document.getElementById('submitButton');

    document.getElementById('year').textContent = new Date().getFullYear();

    function showMessage(text, success = false) {
      message.textContent = text;
      message.className =
        'rounded-lg p-3 mb-4 text-sm ' +
        (success
          ? 'bg-green-500/10 border border-green-500/30 text-green-300'
          : 'bg-red-500/10 border border-red-500/30 text-red-300');
      message.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      
const businessName = document.getElementById('businessName').value.trim();
const ownerName = document.getElementById('ownerName').value.trim();
const phone = document.getElementById('phone').value.trim();
const email = document.getElementById('email').value.trim().toLowerCase();
const password = document.getElementById('password').value;
const confirmPassword = document.getElementById('confirmPassword').value;
const plan = document.getElementById('plan').value;


      if (password.length < 8) {
        showMessage('Nenosiri lazima liwe na angalau herufi 8.');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('Nenosiri na rudia nenosiri havifanani.');
        return;
      }

      if (!document.getElementById('terms').checked) {
        showMessage('Tafadhali kubali masharti ya matumizi.');
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = 'Inasajili akaunti...';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: businessName,
            business_name: businessName,
            email,
            password,
            plan
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok || data.success === false || data.error) {
          throw new Error(
            data.message ||
            data.error ||
            'Usajili haukufanikiwa. Tafadhali jaribu tena.'
          );
        }

        showMessage(
          'Usajili umekamilika. Unaelekezwa kwenye ukurasa wa kuingia...',
          true
        );

        if (data.token) {
          localStorage.setItem('mrhaas_token', data.token);

          const tenant = data.tenant || {};
          const tenantId = tenant.id || data.tenant_id;

          if (tenantId) {
            localStorage.setItem('mrhaas_tenant_id', tenantId);
          }

          localStorage.setItem('mrhaas_tenant', JSON.stringify(tenant));

          if (data.role) {
            localStorage.setItem('mrhaas_role', data.role);
          }
        }

        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1500);

      } catch (error) {
        showMessage(
          error.message ||
          'Imeshindikana kuwasiliana na server. Hakikisha backend inafanya kazi.'
        );
        submitButton.disabled = false;
        submitButton.textContent = 'Fungua Akaunti';
      }
    });
  </script>
</body>
</html>
