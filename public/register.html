<html lang="sw">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jisajili - MR HAAS NET</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-lg">
    <div class="text-center mb-8"><h1 class="text-3xl font-bold text-blue-400"><i class="fa-solid fa-wifi"></i> MR HAAS NET</h1><p class="text-slate-400 mt-2">Sajili WISP yako na uanze leo - BURE!</p></div>
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <form id="regForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="text-sm text-slate-400">Jina la Biashara <span class="text-red-400">*</span></label><input id="business_name" required placeholder="MR HAAS NET Singida" class="w-full mt-1 rounded-xl border border-slate-700 bg-slate-900 p-3.5 outline-none focus:border-blue-500"></div>
                <div><label class="text-sm text-slate-400">Jina la Mmiliki <span class="text-red-400">*</span></label><input id="owner_name" required placeholder="Sabato Mashenene" class="w-full mt-1 rounded-xl border border-slate-700 bg-slate-900 p-3.5 outline-none focus:border-blue-500"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="text-sm text-slate-400">Namba ya Simu <span class="text-red-400">*</span></label><input id="phone" required type="tel" placeholder="2557XXXXXXXX" class="w-full mt-1 rounded-xl border border-slate-700 bg-slate-900 p-3.5 outline-none focus:border-blue-500"></div>
                <div><label class="text-sm text-slate-400">Email <span class="text-red-400">*</span></label><input id="email" required type="email" placeholder="wisp@mfano.co.tz" class="w-full mt-1 rounded-xl border border-slate-700 bg-slate-900 p-3.5 outline-none focus:border-blue-500"></div>
            </div>
            <div><label class="text-sm text-slate-400">Password <span class="text-red-400">*</span></label><input id="password" required type="password" placeholder="Chagua password imara" class="w-full mt-1 rounded-xl border border-slate-700 bg-slate-900 p-3.5 outline-none focus:border-blue-500"></div>
            <div class="rounded-xl bg-blue-950/30 border border-blue-900 p-3 text-xs text-blue-300"><i class="fa-solid fa-gift mr-1"></i> <b>Free Plan:</b> Vifaa 2 na Wateja 50 bure - Boresha baadaye ukikua!</div>
            <p id="error" class="text-sm text-red-400 hidden"></p>
            <button type="submit" id="btn" class="w-full rounded-xl bg-blue-600 p-3.5 font-bold hover:bg-blue-500">Tengeneza Akaunti Yangu</button>
        </form>
        <div class="mt-6 text-center text-sm text-slate-400">Tayari una akaunti? <a href="login.html" class="text-blue-400 font-bold hover:underline">Ingia hapa</a></div>
    </div>
</div>
<script>
const API = 'https://mr-haas-net-backend.onrender.com';
document.getElementById('regForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn=document.getElementById('btn'); const err=document.getElementById('error');
    btn.textContent='Inatengeneza...'; btn.disabled=true; err.classList.add('hidden');
    try{
        const res = await fetch(API + '/api/auth/register', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                business_name: document.getElementById('business_name').value,
                owner_name: document.getElementById('owner_name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        });
        const data = await res.json();
        if(!data.success) throw new Error(data.message);
        localStorage.setItem('token', data.token);
        localStorage.setItem('tenant_id', data.tenant_id);
        localStorage.setItem('tenant_info', JSON.stringify(data.tenant));
        alert('Hongera! Akaunti imetengenezwa. Sasa unaingia kwenye dashboard yako.');
        window.location.href='dashboard.html';
    }catch(ex){
        err.textContent=ex.message; err.classList.remove('hidden');
        btn.textContent='Tengeneza Akaunti Yangu'; btn.disabled=false;
    }
});
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocu </html>
