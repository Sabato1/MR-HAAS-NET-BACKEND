
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Login | MR HAAS NET</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(ellipse at top, #30230a 0%, #111 40%, #050505 100%);
      color: #f8fafc;
    }
    .gold { color: #e7bd58; }
    .gold-bg { background: linear-gradient(135deg,#f5d77e,#b88627); }
    .panel {
      background: rgba(17,17,17,.94);
      border: 1px solid rgba(231,189,88,.3);
      box-shadow: 0 20px 70px rgba(0,0,0,.45);
      backdrop-filter: blur(14px);
    }
    .field {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      background: #090909;
      border: 1px solid #383838;
      color: white;
      outline: none;
    }
    .field:focus {
      border-color: #e7bd58;
      box-shadow: 0 0 0 2px rgba(231,189,88,.12);
    }
    .btn {
      width: 100%;
      border-radius: 10px;
      padding: 14px;
      color: #17120a;
      font-weight: 800;
      background: linear-gradient(135deg,#f5d77e,#b88627);
      transition: opacity .2s;
    }
    .btn:disabled { opacity: .6; }
  </style>
</head>

<body class="flex items-center justify-center p-4">
  <main class="w-full max-w-md">
    <header class="text-center mb-7">
      <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl border border-yellow-600/50 bg-black text-3xl gold">
        <span>MH</span>
      </div>
      <h1 class="text-2xl font-extrabold tracking-wide">
        MR HAAS <span class="gold">NET</span>
      </h1>
      <p class="mt-2 text-sm text-gray-400">
        MULTI-TENANT WISP MANAGEMENT
      </p>
    </header>

    <section class="panel rounded-2xl p-6 sm:p-8">
      <h2 class="text-xl font-bold">Karibu tena</h2>
      <p class="mt-1 mb-6 text-sm text-gray-400">
        Ingia kwenye akaunti yako ya usimamizi wa WISP.
      </p>

      <div id="message" class="hidden mb-4 rounded-lg border p-3 text-sm"
           role="alert" aria-live="polite"></div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label for="email" class="mb-2 block text-sm font-semibold">
            Barua pepe
          </label>
          <input
            id="email"
            name="email"
            class="field"
            type="email"
            placeholder="jina@example.com"
            autocomplete="username"
            required
          >
        </div>

        <div>
          <div class="mb-2 flex items-center justify-between">
            <label for="password" class="text-sm font-semibold">
              Nenosiri
            </label>
            <button type="button" id="togglePassword"
                    class="text-xs gold">
              Onyesha nenosiri
            </button>
          </div>
          <input
            id="password"
            name="password"
            class="field"
            type="password"
            placeholder="Ingiza nenosiri"
            autocomplete="current-password"
            required
          >
        </div>

        <button id="submitBtn" class="btn" type="submit">
          INGIA KWENYE MFUMO
        </button>
      </form>

      <div class="my-6 flex items-center gap-3">
        <div class="h-px flex-1 bg-gray-700"></div>
        <span class="text-xs text-gray-500">AU</span>
        <div class="h-px flex-1 bg-gray-700"></div>
      </div>

      <p class="text-center text-sm text-gray-400">
        Huna akaunti ya WISP?
        <a href="/register.html" class="font-bold gold hover:underline">
          Sajili biashara yako
        </a>
      </p>
    </section>

    <footer class="mt-6 text-center text-xs text-gray-500">
      © <span id="year"></span> MR HAAS NET. Haki zote zimehifadhiwa.
      <p class="mt-2">Mfumo wa Hotspot, PPPoE na usimamizi wa WISP.</p>
    </footer>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('password');

    document.getElementById('year').textContent =
      new Date().getFullYear();

    document.getElementById('togglePassword').addEventListener('click', () => {
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      document.getElementById('togglePassword').textContent =
        showing ? 'Onyesha nenosiri' : 'Ficha nenosiri';
    });

    function showMessage(text, success = false) {
      message.textContent = text;
      message.className = 'mb-4 rounded-lg border p-3 text-sm ' +
        (success
          ? 'border-green-700 bg-green-950 text-green-300'
          : 'border-red-700 bg-red-950 text-red-300');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'INAINGIA...';
      message.className = 'hidden mb-4 rounded-lg border p-3 text-sm';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || data.error ||
            'Imeshindikana kuingia. Hakiki barua pepe na nenosiri.');
        }

        const token = data.token || data.accessToken;
        const tenant = data.tenant || data.data?.tenant || {};
        const tenantId = data.tenant_id || data.tenantId ||
          tenant.id || data.user?.tenant_id;
        const role = data.role || data.user?.role ||
          (tenantId === 'tenant_super_admin' ? 'super_admin' : 'tenant');

        if (!token || !tenantId) {
          throw new Error(
            'Majibu ya server hayajakamilika. Hakikisha API ya login inarudisha token na tenant ID.'
          );
        }

        localStorage.setItem('mrhaas_token', token);
        localStorage.setItem('mrhaas_tenant_id', tenantId);
        localStorage.setItem('mrhaas_tenant', JSON.stringify(tenant));
        localStorage.setItem('mrhaas_role', role);

        showMessage('Umeingia kikamilifu. Tunaelekeza...', true);

        setTimeout(() => {
          if (role === 'super_admin' || tenantId === 'tenant_super_admin') {
            window.location.href = '/super-admin.html';
          } else {
            window.location.href = '/index.html';
          }
        }, 400);

      } catch (error) {
        showMessage(error.message || 'Tatizo la mtandao. Jaribu tena.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'INGIA KWENYE MFUMO';
      }
    });
  </script>
</body>
</html>
