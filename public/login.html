
<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Ingia - MR HAAS NET</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        input {
            color: white;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, .15);
        }
        button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-400">
            <i class="fa-solid fa-wifi"></i> MR HAAS NET
        </h1>
        <p class="text-slate-400 mt-2">
            Ingia kwenye dashboard ya WISP yako
        </p>
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <form id="loginForm" class="space-y-4" autocomplete="on">

            <div>
                <label for="email" class="text-sm text-slate-300">
                    Email ya Biashara
                </label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    required
                    maxlength="254"
                    placeholder="mfano@wisp.co.tz"
                    class="w-full mt-1 rounded-xl border border-slate-700 bg-slate-900 p-3.5"
                >
            </div>

            <div>
                <label for="password" class="text-sm text-slate-300">
                    Password
                </label>

                <div class="relative">
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        class="w-full mt-1 rounded-xl border border-slate-700 bg-slate-900 p-3.5 pr-12"
                        placeholder="Password yako"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Onyesha au ficha password"
                        class="absolute right-3 top-4 text-slate-400 p-1"
                    >
                        <i id="passwordIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <p id="error"
               role="alert"
               aria-live="polite"
               class="text-sm text-red-400 hidden"></p>

            <p id="notice"
               role="status"
               aria-live="polite"
               class="text-sm text-blue-300 hidden"></p>

            <button
                type="submit"
                id="btn"
                class="w-full rounded-xl bg-blue-600 p-3.5 font-bold text-white hover:bg-blue-500 transition"
            >
                <i class="fa-solid fa-right-to-bracket mr-2"></i>
                Ingia Dashboard
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-400">
            Huna akaunti?
            <a href="register.html"
               class="text-blue-400 font-bold hover:underline">
                Jisajili hapa
            </a>
        </div>

        <div class="mt-5 rounded-xl bg-slate-900 border border-slate-800 p-3 text-xs text-slate-400">
            <i class="fa-solid fa-shield-halved text-blue-400 mr-1"></i>
            Tumia taarifa zako halisi za kuingia. Usishiriki password yako.
        </div>
    </div>

    <p class="text-center text-xs text-slate-500 mt-5">
        MR HAAS NET · WISP Management System
    </p>
</div>

<script>
'use strict';

const API = 'https://mr-haas-net-backend.onrender.com';

const form = document.getElementById('loginForm');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const button = document.getElementById('btn');
const errorBox = document.getElementById('error');
const noticeBox = document.getElementById('notice');

function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove('hidden');
    noticeBox.classList.add('hidden');
}

function showNotice(message) {
    noticeBox.textContent = message;
    noticeBox.classList.remove('hidden');
    errorBox.classList.add('hidden');
}

document.getElementById('togglePassword').addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';

    document.getElementById('passwordIcon').className =
        isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
});

form.addEventListener('submit', async (event) => {
    event.preventDefault();

    errorBox.classList.add('hidden');
    noticeBox.classList.add('hidden');

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if (!email || !password) {
        showError('Tafadhali jaza email na password.');
        return;
    }

    button.disabled = true;
    button.textContent = 'Inakagua taarifa...';

    try {
        const response = await fetch(`${API}/api/auth/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ email, password })
        });

        let data;

        try {
            data = await response.json();
        } catch {
            throw new Error(
                'Server imerudisha jibu lisilotambulika. Jaribu tena baadaye.'
            );
        }

        if (!response.ok || !data || data.success !== true) {
            throw new Error(
                typeof data?.message === 'string'
                    ? data.message
                    : 'Imeshindikana kuingia. Hakiki email na password.'
            );
        }

        if (
            typeof data.token !== 'string' ||
            !data.token ||
            typeof data.tenant_id !== 'string' ||
            !data.tenant_id
        ) {
            throw new Error(
                'Jibu la login halina token au tenant ID inayohitajika.'
            );
        }

        // Hifadhi session inayotumiwa na dashboard.
        localStorage.setItem('token', data.token);
        localStorage.setItem('tenant_id', data.tenant_id);

        if (data.tenant && typeof data.tenant === 'object') {
            localStorage.setItem('tenant_info', JSON.stringify(data.tenant));
        } else {
            localStorage.removeItem('tenant_info');
        }

        showNotice('Umefanikiwa kuingia. Inafungua dashboard...');

        if (data.tenant_id === 'tenant_super_admin') {
            window.location.replace('super-admin.html');
        } else {
            window.location.replace('dashboard.html');
        }

    } catch (error) {
        // Usionyeshe maelezo ya kiufundi au siri za server.
        if (error instanceof TypeError) {
            showError(
                'Imeshindikana kuwasiliana na server. Angalia internet na ujaribu tena.'
            );
        } else {
            showError(
                error.message || 'Hitilafu imetokea. Tafadhali jaribu tena.'
            );
        }

        button.disabled = false;
        button.innerHTML =
            '<i class="fa-solid fa-right-to-bracket mr-2"></i> Ingia Dashboard';
    }
});
</script>

</body>
</html>
